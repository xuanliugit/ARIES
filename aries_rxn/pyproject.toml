[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aries-rxn"
version = "0.1.0"
description = "Compact reaction-template extraction and application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xuan Liu", email = "xliu254@illinois.edu" }]
dependencies = [
  "AccFG>=0.1.0",
  "networkx>=3.0",
  "rdkit>=2024.03",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
